# =============================================================================
#  config.yaml  -  the ONE file you edit to change how the web app looks.
#  Save the file and refresh the browser tab (or press "R" in Streamlit) - done.
#  No Python knowledge needed.  Colours are any CSS colour (#hex, rgb(), rgba()).
# =============================================================================

# -----------------------------------------------------------------------------
# 1. APP TEXT & BRANDING
# -----------------------------------------------------------------------------
app:
  page_title: "Diagnose AI"          # browser-tab title
  page_icon: "🩺"                       # emoji (or path to a .png/.ico file)
  brand_name: "Diagonose AI"          # name shown in the sidebar
  hero_title: "Symptom-based Disease Prediction"
  hero_subtitle: "Select the symptoms you are experiencing and our machine-learning model will suggest the most likely conditions."
  layout: "wide"                        # "wide" or "centered"
  sidebar_state: "collapsed"             # "expanded" or "collapsed"

  tabs:
    predict: "  Diagnose"
    insights: "  Model Insights"
    about: "  About"

  symptom_label: "Which symptoms do you have?"
  symptom_placeholder: "Type to search, e.g. headache, cough, itching…"
  predict_button: "Analyse symptoms"
  clear_button: "Clear"
  examples_title: "Quick examples"

  disclaimer_title: "Medical disclaimer"
  disclaimer: >
    This tool is an educational machine-learning project. It is NOT a medical
    device and does NOT provide a diagnosis. Always consult a qualified doctor
    for any health concern. In an emergency, call your local emergency number.
  footer: "Built with Streamlit & XGBoost  "

# -----------------------------------------------------------------------------
# 2. FEATURE SWITCHES  (true = show, false = hide)
# -----------------------------------------------------------------------------
features:
  show_theme_picker: true          # theme drop-down in the sidebar
  show_font_picker: false          # font drop-down
  show_size_controls: false         # text-size & corner-style controls
  show_color_finetune: false        # let visitors override primary/accent colours
  show_hero_stats: false            # the 3 stat badges under the title
  show_examples: true              # one-click example symptom sets
  show_explanation: true           # "Why this result?" panel
  show_download_button: true       # download text report
  show_probability_chart: true     # bar-chart of top-N predictions
  show_disclaimer_banner: true     # disclaimer on the Diagnose tab
  allow_theme_from_url: true       # e.g. http://localhost:8501/?theme=Dark

# -----------------------------------------------------------------------------
# 3. PREDICTION BEHAVIOUR
# -----------------------------------------------------------------------------
prediction:
  top_k: 5                         # how many candidate diseases to show
  min_symptoms: 2                  # minimum symptoms before predicting
  low_confidence_threshold: 0.50   # below this a "low confidence" warning appears
  high_confidence_threshold: 0.80  # above this the badge turns "high"

