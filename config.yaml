# -----------------------------------------------------------------------------
# 5. TYPOGRAPHY
#    "fonts" = every font offered in the sidebar picker.
#    Left side = name shown;  right side = Google-Fonts family spec
#    (copy it from fonts.google.com -> "Get embed code" -> the part after family=)
#    Fonts load from the internet; a system fallback is used if offline.
# -----------------------------------------------------------------------------
typography:
  default_font: "Inter"
  heading_font: "same"              # "same" = same as body, or any name from the list below
  fallback: "-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  fonts:
    "Inter": "Inter:wght@300;400;500;600;700;800"
    "Poppins": "Poppins:wght@300;400;500;600;700;800"
    "Roboto": "Roboto:wght@300;400;500;700;900"
    "Montserrat": "Montserrat:wght@300;400;500;600;700;800"
    "Nunito": "Nunito:wght@300;400;600;700;800"
    "Lato": "Lato:wght@300;400;700;900"
    "Source Sans 3": "Source+Sans+3:wght@300;400;600;700"
    "Merriweather": "Merriweather:wght@300;400;700;900"
    "Playfair Display": "Playfair+Display:wght@400;600;700;800"
    "JetBrains Mono": "JetBrains+Mono:wght@300;400;500;700"

# -----------------------------------------------------------------------------
# 6. SIZES & SPACING   (pixels unless stated)
# -----------------------------------------------------------------------------
sizes:
  base_font_px: 16          # body text  (visitors can scale this with the slider)
  small_font_px: 13         # captions, chips, footer
  h1_px: 34                 # hero title
  h2_px: 24                 # section titles
  h3_px: 18                 # card titles
  result_title_px: 30       # predicted disease name
  stat_value_px: 26         # numbers in the stat badges
  border_radius_px: 16      # roundness of cards/buttons (visitors can change)
  card_padding_px: 22
  hero_padding_px: 32
  content_max_width_px: 1250
  sidebar_width_px: 320

  # Choices offered in the sidebar "Text size" control  (label: multiplier)
  font_scale_options:
    "S": 0.90
    "M": 1.00
    "L": 1.12
    "XL": 1.25
  default_font_scale: "M"

  # Choices offered in the sidebar "Corners" control  (label: radius in px)
  radius_options:
    "Sharp": 4
    "Soft": 10
    "Round": 16
    "Pill": 28

# -----------------------------------------------------------------------------
# 7. EFFECTS
# -----------------------------------------------------------------------------
effects:
  card_shadow: true
  glass_blur_px: 8          # frosted-glass blur behind translucent cards (0 = off)
  animations: true          # fade-in / hover lift effects
  button_gradient: true     # gradient (primary -> accent) on the main button

# -----------------------------------------------------------------------------
# 8. QUICK EXAMPLES  (use exact column names from Training.csv)
# -----------------------------------------------------------------------------
examples:
  "Stomach & acidity":
    [stomach_pain, acidity, vomiting, ulcers_on_tongue]
  "Fever & chills":
    [high_fever, chills, vomiting, sweating, headache, nausea, muscle_pain]
  "Skin problems":
    [itching, skin_rash, nodal_skin_eruptions]
  "Cough & breathing":
    [cough, breathlessness, phlegm, chest_pain, high_fever]
  "Frequent urination":
    [burning_micturition, bladder_discomfort, foul_smell_of urine, continuous_feel_of_urine]

# -----------------------------------------------------------------------------
# 9. DISPLAY NAMES  (the dataset has typos / odd names - fix them here)
#    Anything not listed is auto-prettified:  "joint_pain" -> "Joint pain"
# -----------------------------------------------------------------------------
symptom_names:
  "cold_hands_and_feets": "Cold hands and feet"
  "swollen_extremeties": "Swollen extremities"
  "dischromic _patches": "Discoloured patches"
  "spotting_ urination": "Spotting during urination"
  "foul_smell_of urine": "Foul smell of urine"
  "toxic_look_(typhos)": "Toxic look (typhos)"
  "fluid_overload.1": "Fluid overload"
  "scurring": "Skin scarring / scaling"
  "diarrhoea": "Diarrhoea"
  "extra_marital_contacts": "Extra-marital contacts"

disease_names:
  "Peptic ulcer diseae": "Peptic ulcer disease"
  "Osteoarthristis": "Osteoarthritis"
  "Dimorphic hemmorhoids(piles)": "Haemorrhoids (piles)"
  "(vertigo) Paroymsal  Positional Vertigo": "Paroxysmal positional vertigo"
  "hepatitis A": "Hepatitis A"
  "GERD": "GERD (acid reflux)"
  "Paralysis (brain hemorrhage)": "Paralysis (brain haemorrhage)"

# columns that exist in the CSV but carry no information (all zeros) - hidden in the UI
hidden_symptoms:
  - "fluid_overload"
